server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: finpilot-backend
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

finpilot:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
  ai-service:
    base-url: http://localhost:8000
    timeout-ms: 30000
  reconciliation:
    default-date-tolerance-days: 2
    default-amount-tolerance: 0.00
