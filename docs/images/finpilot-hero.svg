<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <radialGradient id="glowBrand" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15203b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0e172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .title { font-size: 34px; font-weight: 800; fill: #ffffff; letter-spacing: -0.8px; }
    .subtitle { font-size: 14px; fill: #94a3b8; font-weight: 500; }
    .badge-text { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
    .card-title { font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .card-body { font-size: 11px; fill: #94a3b8; line-height: 1.4; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="520" fill="url(#bgGrad)" />
  <rect width="1200" height="520" fill="url(#glowBrand)" />
  <rect width="1200" height="520" fill="url(#glowPurple)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.12" stroke="#334155" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="160" y1="0" x2="160" y2="520" />
    <line x1="320" y1="0" x2="320" y2="520" />
    <line x1="480" y1="0" x2="480" y2="520" />
    <line x1="640" y1="0" x2="640" y2="520" />
    <line x1="800" y1="0" x2="800" y2="520" />
    <line x1="960" y1="0" x2="960" y2="520" />
    <line x1="1120" y1="0" x2="1120" y2="520" />
  </g>

  <!-- Top Hero Header -->
  <g transform="translate(60, 50)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" filter="url(#glow)" />
    <text x="26" y="17" class="mono badge-text" fill="#34d399">ENTERPRISE AGENTIC FIN-OPS</text>
    
    <!-- Title & Subtitle -->
    <text x="0" y="65" class="sans title">FinPilot <tspan fill="#34d399">Platform</tspan></text>
    <text x="0" y="90" class="sans subtitle">Autonomous Financial Operations &bull; Double-Entry Ledger &bull; 4-Tier Reconciliation &bull; LangGraph Multi-Agent Engine</text>
  </g>

  <!-- Architecture Flow Pipeline Cards -->
  <!-- Card 1: Multi-Source Ingestion -->
  <g transform="translate(60, 180)" filter="url(#cardShadow)">
    <rect width="240" height="230" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1" />
    <text x="26" y="40" class="mono" font-size="16" fill="#38bdf8">&gt;__</text>
    
    <text x="16" y="78" class="sans card-title">1. Ingestion &amp; Idempotency</text>
    <text x="16" y="100" class="sans card-body">High-throughput REST &amp; CSV feeds</text>
    <text x="16" y="118" class="sans card-body">Idempotency deduplication</text>
    <text x="16" y="136" class="sans card-body">Lifecycle state machine</text>

    <!-- Tech Badges -->
    <g transform="translate(16, 175)">
      <rect width="88" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="44" y="15" text-anchor="middle" class="mono" font-size="10" fill="#93c5fd">Spring Boot 3</text>
      <rect x="94" width="75" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="131" y="15" text-anchor="middle" class="mono" font-size="10" fill="#cbd5e1">Redis 7</text>
    </g>
  </g>

  <!-- Connection Arrow 1 -> 2 -->
  <g stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.8">
    <path d="M 300 295 L 340 295" />
    <polygon points="340,292 346,295 340,298" fill="#10b981" />
  </g>

  <!-- Card 2: Deterministic Core & Ledger -->
  <g transform="translate(350, 180)" filter="url(#cardShadow)">
    <rect width="250" height="230" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="25" y="40" class="mono" font-size="16" fill="#34d399">∑</text>

    <text x="16" y="78" class="sans card-title">2. Double-Entry &amp; Recon</text>
    <text x="16" y="100" class="sans card-body">Mathematical: Debits = Credits</text>
    <text x="16" y="118" class="sans card-body">4-tier deterministic matching</text>
    <text x="16" y="136" class="sans card-body">Immutable journal audit trails</text>

    <!-- Tech Badges -->
    <g transform="translate(16, 175)">
      <rect width="90" height="22" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <text x="45" y="15" text-anchor="middle" class="mono" font-size="10" fill="#34d399">PostgreSQL 16</text>
      <rect x="96" width="85" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="138" y="15" text-anchor="middle" class="mono" font-size="10" fill="#cbd5e1">Flyway Core</text>
    </g>
  </g>

  <!-- Connection Arrow 2 -> 3 -->
  <g stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.8">
    <path d="M 600 295 L 640 295" />
    <polygon points="640,292 646,295 640,298" fill="#a855f7" />
  </g>

  <!-- Card 3: LangGraph AI Investigation -->
  <g transform="translate(650, 180)" filter="url(#cardShadow)">
    <rect width="245" height="230" rx="14" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" />
    <text x="24" y="40" class="mono" font-size="16" fill="#c084fc">AI</text>

    <text x="16" y="78" class="sans card-title">3. LangGraph Agents</text>
    <text x="16" y="100" class="sans card-body">5-agent state machine workflow</text>
    <text x="16" y="118" class="sans card-body">Evidence citation &amp; root cause</text>
    <text x="16" y="136" class="sans card-body">Strict zero-mutation sandbox</text>

    <!-- Tech Badges -->
    <g transform="translate(16, 175)">
      <rect width="84" height="22" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
      <text x="42" y="15" text-anchor="middle" class="mono" font-size="10" fill="#d8b4fe">LangGraph</text>
      <rect x="90" width="70" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="125" y="15" text-anchor="middle" class="mono" font-size="10" fill="#cbd5e1">FastAPI</text>
    </g>
  </g>

  <!-- Connection Arrow 3 -> 4 -->
  <g stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.8">
    <path d="M 895 295 L 935 295" />
    <polygon points="935,292 941,295 935,298" fill="#f59e0b" />
  </g>

  <!-- Card 4: Maker-Checker Approval Center -->
  <g transform="translate(945, 180)" filter="url(#cardShadow)">
    <rect width="195" height="230" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
    <text x="24" y="40" class="mono" font-size="16" fill="#fbbf24">✓✓</text>

    <text x="16" y="78" class="sans card-title">4. Governance</text>
    <text x="16" y="100" class="sans card-body">Segregation of duties</text>
    <text x="16" y="118" class="sans card-body">No self-approval</text>
    <text x="16" y="136" class="sans card-body">Deterministic exec</text>

    <!-- Tech Badges -->
    <g transform="translate(16, 175)">
      <rect width="105" height="22" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
      <text x="52" y="15" text-anchor="middle" class="mono" font-size="10" fill="#fde68a">Maker-Checker</text>
    </g>
  </g>

  <!-- Bottom Metric Pills -->
  <g transform="translate(60, 440)">
    <rect width="250" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="17" r="4" fill="#10b981" />
    <text x="28" y="22" class="mono" font-size="11" fill="#cbd5e1">Debits = Credits Enforced</text>

    <rect x="265" width="280" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="281" cy="17" r="4" fill="#3b82f6" />
    <text x="293" y="22" class="mono" font-size="11" fill="#cbd5e1">10,000+ Deterministic Txns</text>

    <rect x="560" width="255" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="576" cy="17" r="4" fill="#a855f7" />
    <text x="588" y="22" class="mono" font-size="11" fill="#cbd5e1">Zero Direct Mutation by AI</text>

    <rect x="830" width="310" height="34" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="846" cy="17" r="4" fill="#f59e0b" />
    <text x="858" y="22" class="mono" font-size="11" fill="#cbd5e1">Strict Maker-Checker Authorization</text>
  </g>
</svg>
