version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finpilot-postgres
    environment:
      POSTGRES_DB: finpilot
      POSTGRES_USER: finpilot_user
      POSTGRES_PASSWORD: finpilot_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot_user -d finpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finpilot-net

  redis:
    image: redis:7-alpine
    container_name: finpilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finpilot-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: finpilot-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - finpilot-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: finpilot-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - finpilot-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finpilot-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: finpilot
      DB_USER: finpilot_user
      DB_PASSWORD: finpilot_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_SERVICE_HOST: ai-service
      AI_SERVICE_PORT: 8000
    networks:
      - finpilot-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: finpilot-ai-service
    ports:
      - "8000:8000"
    networks:
      - finpilot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finpilot-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - finpilot-net

volumes:
  pgdata:

networks:
  finpilot-net:
    driver: bridge
